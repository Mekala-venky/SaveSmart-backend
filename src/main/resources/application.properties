
spring.application.name=SaveSmart-backend

# Server
server.port=${PORT:8080}
server.error.include-message=always

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/savesmart_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT
savesmart.jwt.secret=${JWT_SECRET}
savesmart.jwt.expiration=86400000

logging.level.org.springframework.security=INFO

# Reviewer account
savesmart.reviewer.enabled=${SAVESMART_REVIEWER_ENABLED:true}
savesmart.reviewer.email=${SAVESMART_REVIEWER_EMAIL:reviewer@savesmart.app}
savesmart.reviewer.password=${SAVESMART_REVIEWER_PASSWORD}
savesmart.reviewer.full-name=${SAVESMART_REVIEWER_NAME:SaveSmart Reviewer}

# CORS
savesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
